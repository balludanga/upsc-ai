version: "3.9"

# For local development on machines with limited RAM (e.g. 8GB Macs).
# Ollama runs natively on the host (not containerized) to save memory —
# only Postgres, Qdrant, and the API run in Docker.
#
# Usage: docker compose -f docker-compose.local.yml up -d --build

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: upsc_user
      POSTGRES_PASSWORD: upsc_pass
      POSTGRES_DB: upsc_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - qdrant
    ports:
      - "8000:8000"
    extra_hosts:
      # Lets the API container reach Ollama running natively on your Mac
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  qdrant_data:
