version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: upsc_user
      POSTGRES_PASSWORD: upsc_pass
      POSTGRES_DB: upsc_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - qdrant
      - ollama
    ports:
      - "8000:8000"
    volumes:
      # Mount the app source so code edits do not require an image rebuild.
      # Dependency changes still need: docker compose build api
      - ./app:/app/app

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
